# ---------------------------------
# frontend: Deployment + Service
# (Frontend servido por Nginx)
# ---------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-app
spec:
  replicas: 2 # Dos instancias para disponibilidad

  selector:
    matchLabels:
      app: frontend-app

  template:
    metadata:
      labels:
        app: frontend-app

    spec:
      containers:
        - name: frontend-app

          # Imagen construida desde el Dockerfile del frontend (placeholder).
          image: ECR_IMAGE_URI_PLACEHOLDER

          # Puerto HTTP dentro del contenedor (Nginx).
          ports:
            - containerPort: 80

          # Recursos para scheduling.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---

# Service público para exponer el frontend.
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
spec:
  selector:
    app: frontend-app

  ports:
    - port: 80
      targetPort: 80

  # LoadBalancer asigna un balanceador externo y DNS público.
  type: LoadBalancer # Esto crea el DNS público para el IE2
